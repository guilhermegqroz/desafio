spring.application.name=projectportfolioapi

spring.datasource.url=jdbc:postgresql://localhost:5432/project_portfolio_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
membro.api.url=${MEMBRO_API_URL}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=${SECURITY_USERNAME}
spring.security.user.password={noop}${SECURITY_PASSWORD}